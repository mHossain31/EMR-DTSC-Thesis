# Pilot (docs/SPECIFICATION.md M4): runtime, variance and power on the pilot seeds; protocol freeze.
# C4 (eco_ml) needs the frozen model from M5; C3 is its proxy for runtime and variance. eco_reactive with alpha = 0
# is the alpha = 0 sanity check on Flushing (G4). legacy_ml_literal (threshold 1.88 mg/s) is exploratory.
name: pilot
scenario: flushing
levels: [light, moderate, heavy]
seed_role: pilot
reconcile: true
conditions:
  - {controller: static}
  - {controller: tt_adaptive}
  - {controller: random_reroute, params: {eta: 0.3, tau_avg_s: 180, router: traveltime_weights}}
  - {controller: eco_reactive, params: {alpha: 0.5, tau_avg_s: 180, router: traveltime_weights}}
  - {controller: eco_reactive, params: {alpha: 0.0, tau_avg_s: 180, router: traveltime_weights}, label: eco_reactive_a0}
  - {controller: legacy_ml, params: {threshold_mg_s: legacy_quantile, model_id: legacy_rf}}
  - {controller: legacy_ml, params: {threshold_mg_s: 1.88, model_id: legacy_rf}, label: legacy_ml_literal}
