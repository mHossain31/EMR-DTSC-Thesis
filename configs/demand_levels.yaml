# Calibrated demand levels (docs/SPECIFICATION.md 6.5). Generated by `python -m nycemis calibrate`; do not edit by hand.
# Density = total insertion density (vehicles per hour per km), split across fleet groups by share.
scenarios:
  flushing:
    pilot_seeds:
    - 9000
    - 9001
    - 9002
    - 9003
    - 9004
    response: speed_ratio = sum(duration - timeLoss) / sum(duration), finished trips
      departing in [900, 3600] s, static runs, mean over pilot seeds; relative speed
      ratio = speed_ratio / speed_ratio at the reference density
    reference_density_per_h_km: 1.0
    reference_speed_ratio: 0.5238
    levels:
      light:
        density_per_h_km: 10.0
        target_relative_speed_ratio: 0.95
